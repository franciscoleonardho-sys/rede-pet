<!-- REDE PET v18: Versão Completa e Integrada (Início/Feed, Match, Cadastro Fiel, Mapa e Sobre Nós) -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDE PET</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7f6;
    color:#064e3b;
    line-height:1.5;
}

header{
    background:#064e3b;
    color:white;
    padding:20px;
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    letter-spacing:2px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 18px;
}

.pagina{
    display:none;
}

.pagina.ativa{
    display:block;
}

button{
    font-family:inherit;
}

.botao{
    border:none;
    background:#064e3b;
    color:white;
    padding:14px 25px;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.botao:hover{
    opacity:0.9;
    background:#064e3b;
    color:white;
}

.botao-secundario{
    background:#064e3b;
    color:white;
}

.botao-secundario:hover{
    background:#04392b;
    color:white;
    opacity:1;
}

/* INÍCIO & FEED */

.inicio{
    text-align:center;
    padding:30px 10px;
}

.inicio h1{
    font-size:32px;
    margin-bottom:12px;
}

.inicio p{
    color:#064e3b;
    max-width:650px;
    margin:auto;
}

.inicio h2{
    margin-top:30px;
    margin-bottom:20px;
}

.botoes-inicio{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

/* FORMULÁRIO DE CADASTRO */

.bloco{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:25px;
    margin-bottom:25px;
}

.bloco h2{
    color:#064e3b;
    margin-bottom:20px;
}

.campo{
    margin-bottom:18px;
}

.campo label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:#064e3b;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
    color:#222;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.linha{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.opcoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.opcao{
    border:1px solid #ccc;
    background:white;
    color:#333;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
}

.opcao.selecionada{
    background:#064e3b;
    color:white;
    border-color:#064e3b;
}

/* PESO */

.peso-controle{
    display:flex;
    align-items:center;
    gap:15px;
}

.peso-controle button{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#064e3b;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.peso-valor{
    font-size:22px;
    font-weight:bold;
    min-width:80px;
    text-align:center;
}

/* MATCH */

.filtro-match{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:18px;
    margin-bottom:25px;
}

.filtro-match label{
    display:block;
    color:#064e3b;
    font-weight:bold;
    margin-bottom:8px;
}

#filtroStatus{
    max-width:350px;
}

.lista-pets{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.pet-card{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:.15s;
    position:relative;
}

.pet-card:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.pet-foto{
    width:100%;
    height:240px;
    object-fit:cover;
    display:block;
    background:#eee;
}

.pet-sem-foto{
    height:240px;
    background:#e6ebe8;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#777;
}

.pet-resumo{
    padding:15px;
}

.pet-nome{
    font-size:21px;
    margin-bottom:8px;
    color:#064e3b;
    font-weight:bold;
}

.pet-status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#e6ebe8;
    color:#064e3b;
    font-size:12px;
    font-weight:bold;
}

.pet-topo-resumo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.botao-editar-circular{
    width:34px;
    height:34px;
    border:2px solid #b91c1c;
    border-radius:50%;
    background:#fff;
    color:#b91c1c;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
    font-weight:700;
}

.botao-editar-circular:hover{
    background:#b91c1c;
    color:#fff;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    inset:0;
    background:rgba(0,0,0,.65);
    padding:20px;
    overflow-y:auto;
}

.modal.aberto{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-conteudo{
    background:white;
    width:100%;
    max-width:750px;
    margin:auto;
    border-radius:12px;
    overflow:hidden;
    max-height:90vh;
    display:flex;
    flex-direction:column;
}

.modal-corpo{
    padding:25px;
    overflow-y:auto;
}

/* COMENTÁRIOS */

.comentarios-bloco{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #ddd;
}

.form-comentario{
    background:#f5f7f6;
    border:1px solid #dfe5e2;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

/* MAPA INTERATIVO */

.mapa-container{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
}

.mapa-rede-pet{
    width:100%;
    overflow:hidden;
    border-radius:10px;
    background:#eef2ef;
    border:1px solid #d8dfdb;
}

.mapa-topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    background:#fff;
    color:#064e3b;
    font-weight:bold;
    font-size:13px;
}

.mapa-cidade{
    position:relative;
    height:450px;
    overflow:hidden;
    background:linear-gradient(135deg,#e7ece9,#f4f5f1 45%,#e6ece8);
}

.marcador-pet{
    position:absolute;
    z-index:5;
    width:68px;
    height:68px;
    border:2px solid #fff;
    border-radius:50%;
    background:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:transform .15
