<script>

const URL_APPS_SCRIPT =
"https://script.google.com/a/macros/asces.edu.br/s/AKfycbxvz1nBq8g9DzKFnIkfpQ2PPg5O6R6mom52L1wqz75F5MOmmKCosSpTws9S5mZqUqVlhg/exec";


let peso = 0;


/* =====================================================
   NAVEGAÇÃO
   ===================================================== */

function abrirPagina(nome) {

    document
        .querySelectorAll(".pagina")
        .forEach(function(pagina) {

            pagina.classList.remove("ativa");

        });

    const pagina =
        document.getElementById(nome);

    if (pagina) {

        pagina.classList.add("ativa");

    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    if (nome === "match") {

        carregarPets();

    }
}


/* =====================================================
   OPÇÕES
   ===================================================== */

function selecionar(botao, campo, valor) {

    const grupo =
        botao.parentElement;

    grupo
        .querySelectorAll(".opcao")
        .forEach(function(b) {

            b.classList.remove(
                "selecionada"
            );

        });

    botao.classList.add(
        "selecionada"
    );

    document
        .getElementById(campo)
        .value = valor;

    if (campo === "especie") {

        const outro =
            document.getElementById(
                "especieOutro"
            );

        outro.style.display =
            valor === "Outro"
                ? "block"
                : "none";
    }
}


/* =====================================================
   PESO
   ===================================================== */

function alterarPeso(valor) {

    peso += valor;

    if (peso < 0) {
        peso = 0;
    }

    if (peso > 100) {
        peso = 100;
    }

    document
        .getElementById("pesoValor")
        .textContent = peso;
}


/* =====================================================
   FOTO
   ===================================================== */

function converterImagem(file) {

    return new Promise(
        function(resolve, reject) {

            if (!file) {

                resolve("");

                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function() {

                    resolve(
                        reader.result
                    );

                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );
}


/* =====================================================
   CADASTRO
   ===================================================== */

document
    .getElementById("formPet")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const mensagem =
                document.getElementById(
                    "mensagem"
                );

            mensagem.style.display =
                "block";

            mensagem.textContent =
                "Salvando cadastro...";


            const arquivo =
                document
                    .getElementById("foto")
                    .files[0];


            const foto =
                await converterImagem(
                    arquivo
                );


            const dados = {

                foto: foto,

                status:
                    document
                        .getElementById("status")
                        .value,

                nome:
                    document
                        .getElementById("nome")
                        .value,

                idade:
                    document
                        .getElementById("idade")
                        .value,

                peso:
                    peso,

                castrado:
                    document
                        .getElementById("castrado")
                        .value,

                especie:
                    document
                        .getElementById("especie")
                        .value,

                especieOutro:
                    document
                        .getElementById("especieOutro")
                        .value,

                vacinado:
                    document
                        .getElementById("vacinado")
                        .value,

                raca:
                    document
                        .getElementById("raca")
                        .value,

                sexo:
                    document
                        .getElementById("sexo")
                        .value,

                porte:
                    document
                        .getElementById("porte")
                        .value,

                cor:
                    document
                        .getElementById("cor")
                        .value,

                tutorNome:
                    document
                        .getElementById("tutorNome")
                        .value,

                tutorContato:
                    document
                        .getElementById("tutorContato")
                        .value,

                whatsappPublico:
                    document
                        .getElementById(
                            "whatsappPublico"
                        )
                        .value,

                endereco:
                    document
                        .getElementById("endereco")
                        .value,

                bairro:
                    document
                        .getElementById("bairro")
                        .value,

                cidade:
                    document
                        .getElementById("cidade")
                        .value,

                pontoReferencia:
                    document
                        .getElementById(
                            "pontoReferencia"
                        )
                        .value,

                ultimaVez:
                    document
                        .getElementById("ultimaVez")
                        .value,

                observacoes:
                    document
                        .getElementById(
                            "observacoes"
                        )
                        .value
            };


            enviarCadastro(dados);

        }
    );


/* =====================================================
   ENVIO REAL PARA O APPS SCRIPT
   ===================================================== */

function enviarCadastro(dados) {

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    let iframe =
        document.getElementById(
            "iframeCadastro"
        );


    if (!iframe) {

        iframe =
            document.createElement(
                "iframe"
            );

        iframe.id =
            "iframeCadastro";

        iframe.name =
            "iframeCadastro";

        iframe.style.display =
            "none";

        document.body.appendChild(
            iframe
        );
    }


    const formulario =
        document.createElement(
            "form"
        );

    formulario.method =
        "POST";

    formulario.action =
        URL_APPS_SCRIPT;

    formulario.target =
        "iframeCadastro";

    formulario.style.display =
        "none";


    const campo =
        document.createElement(
            "input"
        );

    campo.type =
        "hidden";

    campo.name =
        "payload";

    campo.value =
        JSON.stringify(dados);


    formulario.appendChild(
        campo
    );

    document.body.appendChild(
        formulario
    );


    mensagem.textContent =
        "Salvando cadastro...";


    window.addEventListener(
        "message",
        function receberResposta(event) {

            if (
                !event.data ||
                typeof event.data !==
                "object"
            ) {
                return;
            }


            if (
                event.data.sucesso
            ) {

                mensagem.textContent =
                    "PET cadastrado com sucesso!";


                document
                    .getElementById(
                        "formPet"
                    )
                    .reset();


                peso = 0;


                document
                    .getElementById(
                        "pesoValor"
                    )
                    .textContent =
                    "0";


                document
                    .querySelectorAll(
                        ".opcao"
                    )
                    .forEach(
                        function(botao) {

                            botao.classList
                                .remove(
                                    "selecionada"
                                );

                        }
                    );


                /*
                   Atualiza imediatamente
                   a aba MATCH.
                */

                carregarPets();

            } else {

                mensagem.textContent =
                    "Erro ao salvar o cadastro: " +
                    (
                        event.data.mensagem ||
                        "Erro desconhecido."
                    );
            }

            formulario.remove();

        },
        {
            once: true
        }
    );


    formulario.submit();

}


/* =====================================================
   LISTAR PETS — JSONP
   ===================================================== */

function carregarPets() {

    const lista =
        document.getElementById(
            "listaPets"
        );


    if (!lista) {
        return;
    }


    lista.innerHTML =
        '<div class="carregando">' +
        'Carregando PETs...' +
        '</div>';


    const nomeCallback =
        "receberPets_" +
        Date.now();


    window[nomeCallback] =
        function(pets) {

            try {

                lista.innerHTML = "";


                if (
                    !pets ||
                    !pets.length
                ) {

                    lista.innerHTML =
                        '<div class="carregando">' +
                        'Nenhum PET cadastrado ainda.' +
                        '</div>';

                    return;
                }


                pets.forEach(
                    function(pet) {

                        criarCardPet(
                            pet,
                            lista
                        );

                    }
                );

            } catch (erro) {

                console.error(
                    erro
                );

                lista.innerHTML =
                    '<div class="carregando">' +
                    'Não foi possível carregar os PETs.' +
                    '</div>';

            } finally {

                delete window[
                    nomeCallback
                ];

            }
        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        URL_APPS_SCRIPT +
        "?acao=listarPets" +
        "&callback=" +
        nomeCallback;


    script.onerror =
        function() {

            lista.innerHTML =
                '<div class="carregando">' +
                'Não foi possível carregar os PETs.' +
                '</div>';

            delete window[
                nomeCallback
            ];
        };


    document.body.appendChild(
        script
    );
}


/* =====================================================
   CARD
   ===================================================== */

function criarCardPet(
    pet,
    lista
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "pet-card";


    card.onclick =
        function() {

            abrirModal(pet);

        };


    const foto =
        pet["Foto"] ||
        pet["foto"] ||
        "";


    const nome =
        pet["Nome"] ||
        pet["nome"] ||
        "PET";


    const status =
        pet["Status"] ||
        pet["status"] ||
        "Sem status";


    let imagem =
        '<div class="pet-sem-foto">' +
        'Sem foto' +
        '</div>';


    if (foto) {

        imagem =
            '<img ' +
            'class="pet-foto" ' +
            'src="' +
            foto +
            '" ' +
            'alt="Foto do PET">';

    }


    card.innerHTML =

        imagem +

        '<div class="pet-resumo">' +

            '<h3 class="pet-nome">' +
                escaparHTML(nome) +
            '</h3>' +

            '<span class="pet-status">' +
                escaparHTML(status) +
            '</span>' +

        '</div>';


    lista.appendChild(
        card
    );
}


/* =====================================================
   MODAL
   ===================================================== */

function abrirModal(pet) {

    const modal =
        document.getElementById(
            "modal"
        );


    const imagem =
        document.getElementById(
            "modalFoto"
        );


    const foto =
        pet["Foto"] ||
        pet["foto"] ||
        "";


    if (foto) {

        imagem.src =
            foto;

        imagem.style.display =
            "block";

    } else {

        imagem.style.display =
            "none";
    }


    document
        .getElementById(
            "modalNome"
        )
        .textContent =
        pet["Nome"] ||
        pet["nome"] ||
        "PET";


    const dados =
        document.getElementById(
            "modalDados"
        );


    dados.innerHTML =

        dado(
            "Status",
            pet["Status"]
        ) +

        dado(
            "Espécie",
            pet["Especie"]
        ) +

        dado(
            "Raça",
            pet["Raca"]
        ) +

        dado(
            "Sexo",
            pet["Sexo"]
        ) +

        dado(
            "Idade",
            pet["Idade"]
        ) +

        dado(
            "Peso",
            pet["Peso"]
                ? pet["Peso"] + " kg"
                : "-"
        ) +

        dado(
            "Porte",
            pet["Porte"]
        ) +

        dado(
            "Cor",
            pet["Cor"]
        ) +

        dado(
            "Castrado",
            pet["Castrado"]
        ) +

        dado(
            "Vacinado",
            pet["Vacinado"]
        ) +

        dado(
            "Última vez visto",
            pet["Ultima Vez"]
        ) +

        dado(
            "Ponto de referência",
            pet["Ponto Referencia"]
        ) +

        dado(
            "Observações",
            pet["Observacoes"]
        );


    if (
        pet["WhatsApp Publico"] ===
        "Sim"
    ) {

        dados.innerHTML +=

            '<hr style="margin:18px 0">' +

            dado(
                "Tutor",
                pet["Tutor Nome"]
            ) +

            dado(
                "Contato",
                pet["Tutor Contato"]
            );
    }


    modal.classList.add(
        "aberto"
    );
}


/* =====================================================
   DADO
   ===================================================== */

function dado(
    titulo,
    valor
) {

    return (

        '<div class="dado">' +

            '<strong>' +
                titulo +
                ':</strong> ' +

            escaparHTML(
                valor || "-"
            ) +

        '</div>'

    );
}


/* =====================================================
   SEGURANÇA
   ===================================================== */

function escaparHTML(valor) {

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   FECHAR MODAL
   ===================================================== */

function fecharModal() {

    document
        .getElementById(
            "modal"
        )
        .classList.remove(
            "aberto"
        );
}


document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                fecharModal();

            }

        }
    );

</script>
